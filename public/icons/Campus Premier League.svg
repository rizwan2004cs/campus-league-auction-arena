  <defs>
    <linearGradient id="pastel-swoosh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>  <!-- Pastel Yellow -->
      <stop offset="50%" stop-color="#FFD2A5"/> <!-- Pastel Orange -->
      <stop offset="100%" stop-color="#FFD1DC"/> <!-- Pastel Pink -->
    </linearGradient>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E58A63"/>  <!-- Deep Pastel Orange -->
      <stop offset="100%" stop-color="#D96A8D"/> <!-- Deep Pastel Pink -->
    </linearGradient>
    <style>
      .st0 {
        fill: none;
      }

      .st1 {
        fill: url(#text-gradient); /* Batsman silhouette */
      }

      .st2 {
        fill: url(#pastel-swoosh); /* Outer Swoosh */
      }

      .st3 {
        fill: url(#text-gradient); /* General text */
      }
      
      .st-accent {
        fill: url(#pastel-swoosh); /* Inner Swoosh */
      }

      .st4 {
        clip-path: url(#clippath);
      }

      @font-face {
        font-family: 'Bricolage Grotesque';
        src: url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800');
      }

      .logo-text {
        font-family: 'Arial Black', 'Impact', 'Bricolage Grotesque', sans-serif;
        font-weight: 900;
        letter-spacing: 2px;
      }
    </style>
    <clipPath id="clippath">
      <rect class="st0" x="-122.5" y="-1544.9" width="4679.6" height="3424.1"/>
    </clipPath>
    <linearGradient id="coral-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf497"/>
      <stop offset="40%" stop-color="#fbc2eb"/>
      <stop offset="100%" stop-color="#fd8287"/>
    </linearGradient>
    <linearGradient id="text-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8c405a"/>
      <stop offset="100%" stop-color="#3b2a30"/>
    </linearGradient>
    <linearGradient id="text-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fd8287"/>
      <stop offset="50%" stop-color="#fbc2eb"/>
      <stop offset="100%" stop-color="#fd8287"/>
    </linearGradient>
  </defs>
